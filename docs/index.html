<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexa Window Opener – 3D view</title>
<meta name="description" content="Interactive 3D model of a voice-controlled tilt window opener (ESP32, gear motor, 3D-printed housing).">
<meta property="og:image" content="https://eric-hesse.github.io/alexa-window-opener/images/og_inside.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f2ec; --ink:#181e2c; --muted:#606876; --acc:#d6542c; --line:#c8c1b6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; }
  header { position:absolute; top:28px; left:32px; z-index:2; pointer-events:none; }
  h1 { margin:0; font-size:clamp(28px,4vw,46px); font-weight:800; letter-spacing:-0.02em; line-height:1.05; }
  h1 span { color:var(--acc); }
  header p { margin:10px 0 0; color:var(--muted); font-size:16px; max-width:420px; }
  model-viewer { width:100%; height:100%; --poster-color:transparent; }
  .controls { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:2;
              background:#fffdf9; border:1px solid var(--line); border-radius:999px; padding:6px; box-shadow:0 6px 24px rgba(0,0,0,.08); }
  .controls button { font:600 15px Inter,system-ui,sans-serif; border:0; border-radius:999px; padding:10px 20px; cursor:pointer;
                     background:transparent; color:var(--ink); }
  .controls button.active { background:var(--ink); color:#fff; }
  .versions { position:absolute; bottom:96px; left:50%; transform:translateX(-50%); z-index:2; display:flex; align-items:flex-start; }
  .versions .line { position:absolute; top:11px; left:42px; right:42px; height:3px; background:var(--line); }
  .versions button { position:relative; background:none; border:0; cursor:pointer; width:84px; padding:0; font:700 15px Inter,system-ui,sans-serif; color:var(--muted); }
  .versions button i { display:block; width:22px; height:22px; margin:0 auto 6px; border-radius:50%; border:3px solid var(--acc); background:var(--bg); transition:transform .15s; }
  .versions button:hover i { transform:scale(1.15); }
  .versions button.active { color:var(--acc); } .versions button.active i { background:var(--acc); }
  .caption { position:absolute; bottom:160px; left:50%; transform:translateX(-50%); z-index:2; text-align:center; width:min(560px,90vw); }
  .caption b { display:block; font-size:17px; } .caption span { color:var(--muted); font-size:14px; }
  .hint { display:none; position:absolute; bottom:92px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:13px; z-index:2; white-space:nowrap; }
  footer { position:absolute; bottom:28px; right:32px; z-index:2; font-size:14px; }
  footer a { color:var(--muted); text-decoration:none; } footer a:hover { color:var(--acc); }
  .note { position:absolute; top:32px; right:32px; z-index:2; font-size:12px; color:var(--muted); max-width:240px; text-align:right; }
  @media (max-width:1000px){ footer{bottom:auto;top:auto;position:absolute;left:50%;right:auto;transform:translateX(-50%);bottom:4px;white-space:nowrap} .controls{bottom:40px} .versions{bottom:104px} .caption{bottom:168px} }
  @media (max-width:700px){ .note{display:none} header{left:20px} }
</style>
</head>
<body>
<header>
  <h1>Alexa Window<br><span>Opener</span></h1>
  <p>Voice-controlled opener for a tilt window, built with an ESP32, a JGA25-370 gear motor and 3D-printed parts.</p>
</header>
<div class="note">Drag to rotate · scroll to zoom<br>The mounting hook of the original Cults3D model is replaced by a simplified guide.</div>

<model-viewer id="mv" src="3d/v4_open.glb?v=5" alt="3D model of the window opener"
  camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="3000" rotation-per-second="12deg"
  camera-orbit="200deg 62deg 105%" min-camera-orbit="auto auto 40%" interaction-prompt="none"
  shadow-intensity="0.9" shadow-softness="0.8" exposure="0.85" tone-mapping="agx" environment-image="neutral">
</model-viewer>

<div class="caption" id="cap"><b></b><span></span></div>
<div class="versions" id="vers"><div class="line"></div>
  <button data-v="1"><i></i>v1</button><button data-v="2"><i></i>v2</button><button data-v="3"><i></i>v3</button><button data-v="4" class="active"><i></i>v4</button>
</div>
<div class="controls">
  <button id="bOpen" class="active">Inside</button>
  <button id="bClosed">Closed</button>
</div>
<footer><a href="https://github.com/eric-hesse/alexa-window-opener">github.com/eric-hesse/alexa-window-opener</a></footer>

<script>
  const mv = document.getElementById('mv'), bO = document.getElementById('bOpen'), bC = document.getElementById('bClosed');
  const cap = document.getElementById('cap');
  const INFO = {
    1: ['v1 · 8 Oct 2026', 'Faulhaber 2232U009SR with a printed gear train (about 14.7:1). Housing only – motor and gears are not modeled here.'],
    2: ['v2 · 9 Oct 2026', 'Longer housing and revised lid. Housing only – motor and gears are not modeled here.'],
    3: ['v3 · 13 Oct 2026', 'Switched to a JGA25-370 gear motor: the pinion sits directly on the shaft, no printed gearbox.'],
    4: ['v4 · 13 Oct 2026', 'Compact housing, only 3.7 cm from the wall – electronics lie flat, rebated lid.']
  };
  let ver = 4, open = true;
  function load() {
    const orbit = mv.loaded && mv.getCameraOrbit ? mv.getCameraOrbit() : null;
    mv.src = `3d/v${ver}_${open ? 'open' : 'closed'}.glb?v=5`;
    if (orbit) mv.addEventListener('load', () => { mv.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad auto`; }, { once:true });
    bO.classList.toggle('active', open); bC.classList.toggle('active', !open);
    document.querySelectorAll('#vers button').forEach(b => b.classList.toggle('active', +b.dataset.v === ver));
    cap.querySelector('b').textContent = INFO[ver][0]; cap.querySelector('span').textContent = INFO[ver][1];
    history.replaceState(null, '', '#v' + ver);
  }
  bO.onclick = () => { open = true; load(); }; bC.onclick = () => { open = false; load(); };
  document.querySelectorAll('#vers button').forEach(b => b.onclick = () => { ver = +b.dataset.v; load(); });
  const m = location.hash.match(/^#v([1-4])$/); if (m) ver = +m[1];
  customElements.whenDefined('model-viewer').then(load);
</script>
</body>
</html>
