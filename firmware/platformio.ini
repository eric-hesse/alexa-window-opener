; PlatformIO-Projekt Fensteroeffner
; In VS Code mit der Erweiterung "PlatformIO IDE" oeffnen (File -> Open Folder -> diesen Ordner)

[env:esp32dev]
platform = espressif32 @ ^6.9.0   ; Arduino core 2.x – core 3.x defines its own BOOT_PIN
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    aircoookie/Espalexa
    tzapu/WiFiManager
